[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pqscan"
version = "0.1.0"
description = "Footer-statistics-driven conservative Parquet row-group pruning and two-phase column scan"
requires-python = "3.11"
dependencies = ["pyarrow==19.0.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
